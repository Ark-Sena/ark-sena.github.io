project:
  type: website
  output-dir: docs
  resources:
    - content/files/CV_Mathys_Carboila_Dias.pdf

website:
  title: "ArkSena"
  navbar:
    collapse: true
    collapse-below: lg
    toggle-position: right
    left:
      - href: index.qmd
        text: "[Accueil]{.nav-language .nav-language--fr}"
        aria-label: "Accueil"
      - href: en/index.qmd
        text: "[Home]{.nav-language .nav-language--en}"
        aria-label: "Home"
      - href: demo.qmd
        text: "[Démo graphique]{.nav-language .nav-language--fr}"
        aria-label: "Démo graphique"
      - href: demo.qmd
        text: "[Graphic Demo]{.nav-language .nav-language--en}"
        aria-label: "Graphic Demo"
      - href: photogrametry.qmd
        text: "[Photogrammétrie]{.nav-language .nav-language--fr}"
        aria-label: "Photogrammétrie"
      - href: photogrametry.qmd
        text: "[Photogrammetry]{.nav-language .nav-language--en}"
        aria-label: "Photogrammetry"
    right:
      - href: index.qmd
        text: "[FR]{.language-switch .language-switch--fr .language-switch--home}"
        aria-label: "Afficher le portfolio en français"
      - href: en/index.qmd
        text: "[EN]{.language-switch .language-switch--en .language-switch--home}"
        aria-label: "View the portfolio in English"
      - href: projects/arkhe/index.qmd
        text: "[FR]{.language-switch .language-switch--fr .language-switch--arkhe}"
        aria-label: "Afficher la fiche Arkhe en français"
      - href: en/projects/arkhe/index.qmd
        text: "[EN]{.language-switch .language-switch--en .language-switch--arkhe}"
        aria-label: "View the Arkhe project page in English"
      - href: projects/tap-time-breaker/index.qmd
        text: "[FR]{.language-switch .language-switch--fr .language-switch--ttb}"
        aria-label: "Afficher la fiche Tap Time Breaker en français"
      - href: en/projects/tap-time-breaker/index.qmd
        text: "[EN]{.language-switch .language-switch--en .language-switch--ttb}"
        aria-label: "View the Tap Time Breaker project page in English"
      - href: projects/igilim/index.qmd
        text: "[FR]{.language-switch .language-switch--fr .language-switch--igilim}"
        aria-label: "Afficher la fiche IGILIM en français"
      - href: en/projects/igilim/index.qmd
        text: "[EN]{.language-switch .language-switch--en .language-switch--igilim}"
        aria-label: "View the IGILIM project page in English"
  page-footer: "© 2026 Mathys Carboila Dias | Built with Quarto & Three.js"
  search: false

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: content/style/styles.css
    toc: true

execute:
  freeze: auto

# Configuration for GitHub Pages
publish:
  provider: "github"
  branch: "main"
